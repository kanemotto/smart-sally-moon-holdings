name: Refresh US market data and publish Smart Sally
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 9-16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Refresh delayed US data
        run: python3 update_scan_github.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
